[package]
name = "lightvector"
version = "0.1.0"
edition = "2021"
description = "A production-grade, asynchronous, page-aligned disk-native vector search engine"

[dependencies]
thiserror = "1.0"
rand = "0.8"
rayon = "1.10"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "distance_benchmark"
harness = false
